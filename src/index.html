    </script>

    <!-- Stand-in shown until Montserrat loads: Arial scaled to Montserrat's width per weight (measured
         on the site's own copy), so the swap does not re-wrap text. Inline, because the main
         stylesheet loads after first paint. Used by --font-family-latin in src/styles/tokens.css. -->
    <style>
      @font-face {
        font-family: 'Montserrat Fallback';
        font-weight: 400;
        src: local('Arial');
        size-adjust: 112%;
      }
      @font-face {
        font-family: 'Montserrat Fallback';
        font-weight: 500;
        src: local('Arial');
        size-adjust: 113.9%;
      }
      @font-face {
        font-family: 'Montserrat Fallback';
        font-weight: 600;
        src: local('Arial Bold');
        size-adjust: 107.6%;
      }
      /* The same for IBM Plex Sans Arabic, with Segoe UI, the Windows stand-in. Arabic and Latin
         letters differ (Segoe's Arabic is wider, its Latin about equal), so each gets its own
         faces; the Arabic ones come last so they win for their range. Other systems have no
         Segoe UI and skip this family. Used by --font-family-arabic. */
      @font-face {
        font-family: 'IBM Plex Sans Arabic Fallback';
        font-weight: 400;
        src: local('Segoe UI');
        size-adjust: 100.6%;
      }
