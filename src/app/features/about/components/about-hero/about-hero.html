@let c = content();

<div class="container-page py-8 xl:py-16">
  <!-- Stacked below xl; text beside the illustration from xl. The Arabic frame centres the row and widens the text. -->
  <div
    class="mx-auto flex max-w-300 flex-col gap-8 xl:flex-row xl:items-start xl:justify-between rtl:xl:items-center"
  >
    <div class="relative flex flex-col gap-4 xl:w-128.5 rtl:xl:w-133.5">
      <h1 class="text-h2-sm text-fg md:text-h1 xl:text-display-md">
        {{ c.title.lead }}
        <span class="text-fg-brand">{{ c.title.highlight }}</span>
      </h1>
      <p class="text-body-md text-fg-secondary">
        @for (part of c.intro; track $index) {
          @if (part.tone) {
            <strong class="font-bold" [class.text-fg-brand]="part.tone === 'brand'">{{
              part.text
            }}</strong>
          } @else {
            <span>{{ part.text }}</span>
          }
        }
      </p>
      <p class="text-body-md text-fg-secondary">{{ c.description }}</p>
    </div>

    <div aria-hidden="true" class="about-hero-art mx-auto w-full max-w-110.25 shrink-0 xl:mx-0">
      <img [ngSrc]="c.art.src" alt="" [width]="c.art.width" [height]="c.art.height" priority />
    </div>
  </div>
</div>
