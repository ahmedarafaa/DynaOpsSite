<div class="container-page">
  <div class="mx-auto flex w-full max-w-300 flex-col items-center gap-8 xl:gap-16">
    <!-- One column of cards; rows with the cover beside the copy on tablet; three columns from xl. -->
    <ul class="grid w-full gap-8 xl:grid-cols-3">
      @for (post of visiblePosts(); track post.title) {
        <li><app-blog-post-card [post]="post" /></li>
      }
    </ul>

    @if (hasMore()) {
      <button
        appButton
        type="button"
        icon="/icons/blog/add-square-white.svg"
        class="flex-row-reverse"
        (click)="loadMore()"
      >
        {{ content().loadMore }}
      </button>
    }
  </div>
</div>
