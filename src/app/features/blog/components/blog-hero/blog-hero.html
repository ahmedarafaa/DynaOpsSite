@let post = content().featured;

<div class="container-page py-8 xl:py-16">
  <div class="mx-auto flex w-full max-w-300 flex-col gap-8 md:gap-16">
    <!-- Figma boxes: 572 / 510px title and 480 / 410px description (English / Arabic). -->
    <div class="flex flex-col items-center gap-4 text-center">
      <h1 class="max-w-143 text-h2 md:text-h1 xl:text-display-md rtl:max-w-127.5">
        {{ content().title }}
      </h1>
      <p class="max-w-120 text-body-md text-fg-secondary rtl:max-w-102.5">
        {{ content().description }}
      </p>
    </div>

    <!-- Stacked below xl with a 300px-high cover on tablet; from xl the 565px cover sits beside the copy. -->
    <article class="relative flex flex-col gap-6 md:gap-12 xl:flex-row xl:items-center">
      <img
        [ngSrc]="post.image.src"
        alt=""
        width="565"
        height="300"
        priority
        class="w-full rounded-cover-lg object-cover md:h-75 xl:w-141.25 xl:shrink-0"
      />
      <div class="flex flex-1 flex-col gap-4">
        <app-blog-post-meta size="md" [date]="post.date" [readMinutes]="post.readMinutes">
          @if (post.isNew) {
            <span class="rounded-badge bg-brand px-3 py-1 text-label-md text-fg-on-brand">
              {{ content().newLabel }}
            </span>
          }
        </app-blog-post-meta>
        <div class="flex flex-col gap-2">
          <h2 class="text-h3 md:text-h2">
            @if (post.href; as href) {
              <!-- The stretched link makes the whole post clickable. -->
              <a [routerLink]="href" class="after:absolute after:inset-0">{{ post.title }}</a>
            } @else {
              {{ post.title }}
            }
          </h2>
          <p class="text-body-md text-fg-secondary">{{ post.excerpt }}</p>
        </div>
        <div class="flex items-center gap-2">
          <img
            [ngSrc]="post.author.avatar"
            alt=""
            width="50"
            height="50"
            class="size-12.5 rounded-full bg-canvas object-cover object-bottom"
          />
          <div>
            <p class="text-h4">{{ post.author.name }}</p>
            <p class="text-body-md text-fg-secondary">{{ post.author.role }}</p>
          </div>
        </div>
      </div>
    </article>
  </div>
</div>
