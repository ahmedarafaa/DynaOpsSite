<app-blog-hero [content]="content.hero" />

<app-blog-posts [content]="content.posts" />

<ng-template appFooterCta>
  <app-cta-container
    [image]="content.footerCta.image.src"
    [imageWidth]="content.footerCta.image.width"
    [imageHeight]="content.footerCta.image.height"
    imagePosition="bottom-end"
    imageSize="device"
  >
    <!-- Figma box: 432 / 407px (English / Arabic) from xl. -->
    <div class="flex max-w-152 flex-col gap-4 xl:max-w-108 xl:rtl:max-w-101.75">
      <h2 class="text-h2 md:text-h1">{{ content.footerCta.title }}</h2>
      <p class="text-body-md">{{ content.footerCta.description }}</p>
    </div>
    <a
      appButton
      variant="secondary"
      icon="/icons/shared/arrow-right-02.svg"
      iconHover="/icons/shared/arrow-right-02-brand.svg"
      directionalIcon
      [routerLink]="content.footerCta.button.href"
    >
      {{ content.footerCta.button.label }}
    </a>
  </app-cta-container>
</ng-template>
