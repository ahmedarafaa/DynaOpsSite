<!-- Figma offsets are measured from the top of the frame, under the 80px header: copy at 108 / 140px, map at 380 / 240px. -->
<!-- From tablet up the copy overlays the map's transparent top; on phones the portrait map follows the copy. -->
<div
  class="relative z-10 container-page pt-7 md:absolute md:inset-x-0 md:top-19 xl:top-20 xl:pt-15"
>
  <div class="mx-auto flex flex-col items-center gap-8 text-center">
    <div class="flex flex-col items-center gap-4">
      <p
        class="flex items-center gap-2 rounded-md border border-surface py-1 ps-1 pe-3 text-label-md"
      >
        <span class="flex size-10 shrink-0 items-center justify-center rounded-sm bg-surface">
          <img [src]="content().badge.icon" alt="" width="25" height="25" class="size-6.25" />
        </span>
        {{ content().badge.label }}
      </p>
      <!-- Figma boxes: 553px on tablet, 684px from xl. -->
      <h1 class="text-h2 md:max-w-138.5 md:text-h1 xl:max-w-171 xl:text-display-md">
        <span class="block">{{ content().titleLead }}</span>
        <!-- The product name keeps the Latin face and metrics on the Arabic page, as in Figma; the role re-resolves them. -->
        <span class="block text-h2 md:text-h1 xl:text-display-md" lang="en" dir="ltr">{{
          content().titleProduct
        }}</span>
      </h1>
      <p class="max-w-144 text-body-md text-fg-secondary">{{ content().description }}</p>
    </div>
    <a
      appButton
      class="self-stretch md:self-auto"
      icon="/icons/shared/arrow-right-02-white.svg"
      directionalIcon
      [routerLink]="content().cta.href"
    >
      {{ content().cta.label }}
    </a>
  </div>
</div>

<app-home-hero-map
  class="hidden opacity-90 md:mt-75 md:block xl:mt-40"
  [dir]="content().mapDir"
  [alt]="content().mapAlt"
/>

<div class="container-page mt-8 pb-6 md:hidden">
  <img
    [ngSrc]="content().mapMobile.src"
    [alt]="content().mapAlt"
    [width]="content().mapMobile.width"
    [height]="content().mapMobile.height"
    class="h-auto w-full"
  />
</div>
