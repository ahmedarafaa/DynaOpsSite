<div class="container-page">
  <div
    class="relative isolate mx-auto max-w-300 overflow-hidden rounded-xl bg-linear-to-l/srgb from-accent/20 to-transparent pb-8 md:pb-16"
  >
    <img
      src="/images/home/integration-grid.svg"
      alt=""
      width="1200"
      height="661"
      loading="lazy"
      class="absolute inset-x-0 top-0 -z-10 h-auto w-full"
    />
    <img
      [ngSrc]="content().illustration.src"
      [alt]="content().illustration.alt"
      [width]="content().illustration.width"
      [height]="content().illustration.height"
      class="h-auto w-full"
    />

    <div class="flex flex-col items-start gap-8 px-4 md:px-12">
      <!-- Figma box: 464px title from tablet up. -->
      <app-home-heading class="items-start md:max-w-116" [content]="content().heading" />
      <ul role="list" class="flex flex-col gap-4">
        @for (point of content().points; track point) {
          <li class="flex items-start gap-2 text-body-md">
            <img
              src="/icons/landing-page/tick-double-02-brand.svg"
              alt=""
              width="24"
              height="24"
              class="size-6 shrink-0"
            />
            {{ point }}
          </li>
        }
      </ul>
      <a
        class="flex items-center gap-1 py-2.75 text-h4 font-medium text-fg-brand"
        [routerLink]="content().link.href"
      >
        {{ content().link.label }}
        <img
          src="/icons/shared/arrow-right-02-brand.svg"
          alt=""
          width="24"
          height="24"
          class="size-6 rtl:-scale-x-100"
        />
      </a>
    </div>
  </div>
</div>
